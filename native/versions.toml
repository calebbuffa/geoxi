# geoxi native dependency manifest.
#
# GEOS is pinned to an exact version with a fixed HTTPS URL and SHA-256
# checksum. `build.rs` downloads, verifies, and extracts it deterministically;
# subsequent builds never re-download a valid archive.
#
# When bumping, fetch the new archive once, compute its SHA-256, and update
# BOTH the version string and the checksum together.

[geos]
version = "3.14.1"
url = "https://download.osgeo.org/geos/geos-3.14.1.tar.bz2"
sha256 = "3c20919cda9a505db07b5216baa980bacdaa0702da715b43f176fb07eff7e716"
# Proof that extraction finished: the build-system entry point and the C API
# header template. A tree missing either is discarded and unpacked again.
markers = ["CMakeLists.txt", "capi/geos_c.h.in"]
